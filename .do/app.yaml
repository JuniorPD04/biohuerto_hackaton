# Plantilla de App Spec para DigitalOcean App Platform.
#
# Uso:
#   1. Reemplaza <TU_USUARIO>/<TU_REPO> y <NOMBRE_DEL_CLUSTER> (el nombre que
#      le pusiste a tu Managed Database en el panel de DO).
#   2. NO pongas secretos reales aqui si vas a commitear este archivo. Deja
#      los placeholders "REPLACE_ME" y complétalos despues, ya sea:
#        doctl apps create --spec .do/app.yaml   (te pedira confirmarlos)
#      o desde la consola web (App > Settings > App-Level / Component Env Vars),
#      donde quedan cifrados (type: SECRET).
#   3. La Managed Database se crea aparte en DO (Databases > Create). Este
#      spec solo la "adjunta" via cluster_name para poder usar
#      ${biohuerto-db.HOSTNAME}, ${biohuerto-db.PORT}, etc. en las env vars.
#   4. Antes del primer deploy hay que crear los roles y el esquema una sola
#      vez a mano (ver README / docs de despliegue) porque App Platform no
#      ejecuta los scripts de docker-entrypoint-initdb.d que usa docker-compose.

name: biohuerto

region: nyc

databases:
  - name: biohuerto-db
    engine: PG
    version: "18"
    production: true
    cluster_name: db-pgsql-nyc1-biohuerto

services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: JuniorPD04/biohuerto_hackaton
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 10
    envs:
      - key: APP_NAME
        value: "Biohuerto Inteligente"
      - key: ENVIRONMENT
        value: "production"
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        value: "postgresql+asyncpg://app_bio_user:${APP_DB_PASSWORD}@${biohuerto-db.HOSTNAME}:${biohuerto-db.PORT}/${biohuerto-db.DATABASE}"
      - key: APP_DB_PASSWORD
        type: SECRET
        value: "REPLACE_ME"
      - key: SECRET_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: "${frontend.PUBLIC_URL}"
      - key: FERNET_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: PGCRYPTO_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: OPENAI_API_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: OPENAI_EMBED_MODEL
        value: "text-embedding-3-small"
      - key: OPENROUTER_API_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: OPENROUTER_MODEL_VISION
        value: "google/gemini-3-flash-preview"
      - key: OPENROUTER_MODEL_TEXT
        value: "google/gemini-2.5-flash"
      - key: RAG_UPLOAD_MAX_MB
        value: "25"
      - key: VAPID_PUBLIC_KEY
        value: "REPLACE_ME"
      - key: VAPID_PRIVATE_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: VAPID_SUBJECT
        value: "mailto:admin@biohuerto.pe"
      - key: NOTIFICATION_WORKER_INTERVAL_SECONDS
        value: "30"

workers:
  - name: notification-worker
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: JuniorPD04/biohuerto_hackaton
      branch: main
      deploy_on_push: true
    run_command: python -m app.notification_worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        value: "postgresql+asyncpg://app_bio_user:${APP_DB_PASSWORD}@${biohuerto-db.HOSTNAME}:${biohuerto-db.PORT}/${biohuerto-db.DATABASE}"
      - key: APP_DB_PASSWORD
        type: SECRET
        value: "REPLACE_ME"
      - key: PGCRYPTO_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: VAPID_PRIVATE_KEY
        type: SECRET
        value: "REPLACE_ME"
      - key: VAPID_SUBJECT
        value: "mailto:admin@biohuerto.pe"
      - key: NOTIFICATION_WORKER_INTERVAL_SECONDS
        value: "30"

jobs:
  - name: migrate
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    github:
      repo: JuniorPD04/biohuerto_hackaton
      branch: main
      deploy_on_push: true
    kind: PRE_DEPLOY
    run_command: python db/apply_migrations.py
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    envs:
      - key: ENVIRONMENT
        value: "production"
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        value: "postgresql+asyncpg://migration_user:${MIGRATION_DB_PASSWORD}@${biohuerto-db.HOSTNAME}:${biohuerto-db.PORT}/${biohuerto-db.DATABASE}"
      - key: APP_DB_PASSWORD
        type: SECRET
        value: "REPLACE_ME"
      - key: MIGRATION_DB_PASSWORD
        type: SECRET
        value: "REPLACE_ME"

static_sites:
  - name: frontend
    source_dir: frontend
    github:
      repo: JuniorPD04/biohuerto_hackaton
      branch: main
      deploy_on_push: true
    build_command: npm run build
    output_dir: dist
    envs:
      - key: VITE_API_URL
        value: "${backend.PUBLIC_URL}"
      - key: VITE_GOOGLE_MAPS_API_KEY
        value: "REPLACE_ME"
      - key: VITE_VAPID_PUBLIC_KEY
        value: "REPLACE_ME"
